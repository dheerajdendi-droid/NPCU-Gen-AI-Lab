[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "npcu-genai-lab"
version = "0.1.0"
description = "Provider-independent foundation for the NPCU GenAI Intelligence Lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=3.8,<4",
  "pinecone>=10,<11",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pypdf>=5,<7",
  "streamlit>=1.49.1,<1.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cu_intelligence"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "live: makes explicitly opted-in calls to real external providers",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
